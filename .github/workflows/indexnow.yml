name: IndexNow Ping

on:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'public/sitemap.xml'
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit to IndexNow
        run: |
          # Extract URLs from sitemap
          URLS=$(grep -oP '(?<=<loc>).*?(?=</loc>)' public/sitemap.xml | head -50)
          
          # Convert to JSON array
          JSON_URLS=$(echo "$URLS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          echo "Submitting URLs: $JSON_URLS"
          
          # Create the payload
          PAYLOAD=$(cat <<EOF
          {
            "host": "geromball.com",
            "key": "geromball-indexnow-key-2026",
            "keyLocation": "https://geromball.com/geromball-indexnow-key-2026.txt",
            "urlList": $JSON_URLS
          }
          EOF
          )
          
          # Submit to IndexNow API endpoints
          echo "Submitting to api.indexnow.org..."
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" || true
          
          echo "Submitting to bing.com..."
          curl -s -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" || true
          
          echo "Done! Submitted $(echo "$URLS" | wc -l) URLs to IndexNow"
